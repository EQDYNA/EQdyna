name: Automatic Testing of EQdyna

# paths-ignore is deliberately NARROW, not a blanket '**.md': README.md is
# read by test_readme_commands.py and test_release_complete.py, so it stays
# in the trigger set unconditionally. pathway_forward.md is NOT ignored
# either (2026-10-01, v5.21.0): check_pretag_ci.py and
# test_release_complete.py read its Tasks-done row (rule 15g), and a
# board-only commit that cannot get its own CI run cannot be a tag target
# (rule 15a), which moved v5.21.0's tag target twice. PROJECT_RULES.md
# stays excluded: no check reads it as data.
#
# push is filtered to master and tags (board row 87, owner 2026-09-24): under
# rule 25 every mission branch reaches master through a PR, whose
# `pull_request` run already gates the identical commit, so a raw
# feature-branch push run was pure duplication (193 runs / 23 failures
# counted 2026-09-23; queue depth cost a release ~75 min). master pushes
# still run -- pr-policy-gate below fires only there -- and tag pushes still
# run. `tags:` must be named explicitly: a push filter that names only
# `branches:` stops tag pushes from triggering at all. (paths-ignore is not
# evaluated for tag pushes.)
#
# `docs/**` was a BLANKET ignore until the v5.20.2 incident (2026-09-30):
# that tag landed at 30ae29e, a commit touching ONLY docs/evidence/**,
# docs/perf_ledger.jsonl, docs/perf_snapshots/** and docs/run_profiles.jsonl
# -- all paths-ignored, so it could never trigger its own push-run, and
# testsys/regression/check_pretag_ci.py accepted its PARENT's green run as
# evidence instead. Those exact paths are NOT inert docs: they are evidence
# and ledger data that testsys/regression/test_term_axis.py and others READ
# (the release-sweep-carry-forward logic, profile/ledger row validation),
# so classifying them paths-ignored was the root cause, not a side effect of
# it. Listed below individually (never re-widened back to `docs/**`) so a
# commit touching only these now DOES trigger its own CI run on push to
# master, closing the gap that let check_pretag_ci.py's ancestor-evidence
# fallback ever get exercised for them in the first place. Every other docs/
# subpath (session logs, design notes, the board history render, notes/,
# figures/, docs/user/ -- which runs its own three content guards per rule
# 25 instead) stays ignored; a new docs/ path defaults to NOT ignored
# (safer direction, rule 2) until someone deliberately adds it here.
# docs/HISTORY.md is deliberately NOT in this list (rule 15g audit, PR #69
# victor-reyes pass, 2026-09-30): testsys/regression/test_history_table.py
# opens it as data (compares it against the commit-message-derived table),
# so it is exactly the class of path rule 15g exists to keep OUT of this
# ignore list, docs-sounding directory name notwithstanding.
on:
  push:
    branches:
      - master
    tags:
      - '**'
    paths-ignore:
      - 'PROJECT_RULES.md'
      - 'pastReleaseNotes.md'
      - 'Docker.guide.md'
      - 'docs/user/**'
      - 'docs/notes/**'
      - 'docs/figures/**'
      - 'docs/BOARD_HISTORY.md'
      - 'docs/cycle_ledger.jsonl'
      - 'docs/release_exempt.txt'
      - 'docs/run_profile.md'
      - 'docs/fortran_python_correspondence.md'
      - 'docs/SESSION_LOG_*.md'
      - 'docs/NOTES_*.md'
      - 'docs/DESIGN_*.md'
  pull_request:

# Since the push filter above (master + tags only), a feature-branch push no
# longer fires `push` at all. The group is still keyed on the ACTUAL head
# commit (not the ref, which differs between events), so if a commit ever
# does arrive through two events -- e.g. a PR's head commit pushed to master
# -- the second run cancels the first instead of both running to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Build runs once in its own job; unit/regression (sharded 3 ways, see the
# unit-regression job below and testsys/ci_shard.py) and the e2e-ci smoke job
# run in parallel downstream, 4 jobs total.
#
# 2026-09-23 (owner-approved test-methodology change): CI no longer runs the
# e2e sweep for physics coverage. The 25-of-30-cell, memory-measured
# fortran-a/-b + five python jobs that used to live here are GONE, along with
# the per-cell RSS-driven splitting that motivated them
# (testsys/matrix.py's MEASURED_PEAK_RSS_GB is still the measured record; it
# just no longer decides matrix.CI_CELLS). Physics coverage across the full
# case x backend table is now the job of the wider, non-CI tiers:
# `run.py e2e` (gate term, on demand) and `run.py release` (full term, the
# release gate -- PROJECT_RULES rule 15/16).
#
# CI's e2e job is now a single SMOKE test: matrix.CI_CELLS is exactly
# test.tpv8 x {fortran, python-jax} at the gate term (5 s). Its
# purpose is portability -- a clean checkout, freshly `pip install`ed
# dependencies, and (for the fortran cell) the RUNNER's own mpich rather than
# this box's Open MPI 4.1.1 -- not physics regression, which the release tier
# already covers at its own full term.
#
# test_ci_workflow_coverage.py proves the union of every `run_e2e.py --ci`
# invocation in this file is exactly matrix.CI_CELLS by parsing this file and
# the table directly, so a future edit that silently drops or double-runs a
# cell fails the regression tier regardless of how many jobs or invocations
# this grows to.
jobs:
  # PR-for-everything workflow (owner decision, 2026-10-04, superseding the
  # 2026-09-23 hybrid model): every PR now takes one of two lanes, and this
  # job is the ONLY place that decides which -- it runs testsys/pr_policy.py
  # in `pr-lane` mode against the PR's own base/head shas (a merge-base
  # diff, matching what the PR's "Files changed" tab shows; see
  # compute_pr_lane_files's docstring for why this differs from the
  # before/after push-range walk pr-policy-gate below uses). `full` reuses
  # the existing is_gated_path/touches_gated_paths union (same definition
  # rule 25's direct-push gate always used, GATED_PREFIXES plus
  # testsys/change_class.py's PHYSICS classification) -- no new
  # classification scheme. Runs ONLY on pull_request: a push to master is
  # always a post-merge event by the time it fires, with nothing left to
  # route.
  detect-lane:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    outputs:
      lane: ${{ steps.classify.outputs.lane }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Classify this PR's lane (fast vs full)
      id: classify
      run: |
        set -eu
        OUT=$(python3 testsys/pr_policy.py pr-lane "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
        echo "$OUT"
        LANE=$(echo "$OUT" | grep '^LANE=' | cut -d= -f2)
        if [ "$LANE" != "fast" ] && [ "$LANE" != "full" ]; then
          echo "REFUSED: pr-lane did not print a recognizable LANE= line"
          exit 1
        fi
        echo "lane=$LANE" >> "$GITHUB_OUTPUT"

  # Needs detect-lane for the pull_request-only lane gate below. On a push
  # (master/tags) detect-lane is SKIPPED, not failed -- and GitHub auto-adds
  # an implicit success() to any `if:` that doesn't already start with a
  # status-check function when the job has `needs:`. An `if:` that was just
  # `github.event_name != 'pull_request' || ...` would therefore itself
  # SKIP on push (a skipped dependency fails the implicit success() check),
  # silently dropping build/unit-regression/e2e-ci-smoke from every push and
  # tag run while the workflow still concludes "success" -- exactly what
  # check_pretag_ci.py reads as green. `!cancelled() && !failure()` below
  # explicitly short-circuits that: a SKIPPED detect-lane satisfies both
  # (cancelled() and failure() are only true for cancellation/failure, not
  # skip), so the custom lane boolean after it is actually evaluated instead
  # of being pre-empted by the injected success() check.
  #
  # build and unit-regression run on BOTH lanes (owner decision 2026-10-07):
  # repo-wide guards (the hardcoded-path guard, board/rule readers) scan the
  # whole tree, so a fast-lane PR that skipped them passed merge-gate and
  # turned master red after merge (41ffebf, 1515597). Only e2e-ci-smoke
  # stays full-lane-only.
  build:
    needs: detect-lane
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install build dependencies
      run: |
        sudo apt-get install git vim make mpich
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        sudo apt-get install python3 python3-pip

    # Exec bits are tracked in git (PROJECT_RULES.md rule 13) and guarded by
    # testsys/regression/test_create_newcase.py.
    - name: Build eqdyna
      run: ./install-eqdyna.sh -m ubuntu

    # Every other job downloads THIS binary rather than rebuilding, so a
    # build failure is unambiguous (only the build job goes red).
    - name: Upload eqdyna binary
      uses: actions/upload-artifact@v4
      with:
        name: eqdyna-bin
        path: bin/eqdyna
        if-no-files-found: error
        retention-days: 1

  # unit + regression, SHARDED (2026-09-23, owner request: "make CI faster
  # without weakening any guard" -- unit-regression was the 3.4-of-4.1-min
  # critical path). testsys/ci_shard.py (owned by this workflow, not by
  # testsys/run.py/matrix.py/run_e2e.py) statically partitions every
  # testsys/regression/test_*.py into 3 groups, hand-balanced against a real
  # timed run (~41.5 s each; see ci_shard.py's own module docstring for the
  # numbers and provenance). Shard 3 also carries the full `pytest
  # testsys/unit` tier. `python3 testsys/run.py unit regression` -- the
  # LOCAL, unsharded command -- is unchanged; sharding is layered on top of
  # it, not a replacement for it, so local dev and CI keep running the exact
  # same set of checks, just split differently. testsys/regression's own
  # test_ci_shard_coverage.py is the guard that a script cannot silently
  # fall out of every shard: it runs INSIDE shard 3 (it is one of shard 3's
  # own scripts) and fails loudly if the union of all 3 shards' assignments
  # stops covering every test_*.py on disk, or a script is double-assigned.
  #
  # Needs the FULL build toolchain in every shard, not just the artifact:
  # several regression guards do their OWN independent compiles
  # (test_make_default_goal.py, test_fault_geometry_guard.py,
  # test_drucker_prager_kernel.py, all in shard 2 or 3), and
  # test_stop_exit_status.py's (shard 1) real-binary probe needs bin/eqdyna
  # present or it SKIPS.
  unit-regression:
    needs: [build, detect-lane]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    strategy:
      # fail-fast: false -- one shard failing must not cancel the other two
      # mid-run; each shard's own SUCCESS/FAIL banners are the useful signal
      # and cancelling early would hide which OTHER scripts also would have
      # failed, which is exactly the information a real regression costs
      # the most to not have.
      fail-fast: false
      matrix:
        shard: ['1', '2', '3']

    steps:
    # fetch-depth: 0 -- this job (all 3 shards), alone among the workflow's
    # jobs, needs real git HISTORY, not just the tree. test_pretag_ci_negative.py
    # (shard 3) drives the pre-tag guard against named past commits (their
    # parents, their changed-path sets), test_history_table.py (shard 2)
    # re-parses the eight legacy commit messages, and the board-separation
    # step below resolves a COMMIT RANGE; checkout@v4's default depth of 1
    # would leave those commits unreachable, turning all three into vacuous
    # passes -- that shallow-clone failure is not hypothetical, it took
    # publish.yml red on 2026-09-23 (fixed in a99902f). fetch-depth: 0 also
    # fetches +refs/heads/*:refs/remotes/origin/*, which is what makes
    # `origin/master` resolvable for that step's fallback range. Repeated
    # identically in all 3 shards (cheap -- the repo is 723 commits, the full
    # fetch costs seconds) rather than centralised in one shard, because a
    # guard that only ONE shard could run is a guard the other two ship
    # without if that one shard is ever skipped or its matrix entry pruned.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Rule 21c / pathway item 80: the MERGE-BOUNDARY half of board/code
    # separation. testsys/hooks/pre-commit refuses a commit whose STAGED set
    # mixes PROJECT_RULES.md/pathway_forward.md with anything else, but it
    # cannot see a `git commit --amend` -- `git diff --cached` compares the
    # index against the commit being REPLACED, so amending code into an
    # existing board-only commit shows the hook a clean set and lands mixed
    # anyway. This step closes that over finished history, on the way in.
    #
    # It sits FIRST in this job, ahead of apt/pip, because it needs nothing
    # but git and the runner's system python3 (the checker is stdlib-only)
    # and a violation should cost seconds, not the whole install.
    #
    # LIMIT, stated so nobody reads this gate as total: the checker skips
    # MERGE commits by design (an automatic merge adds no content of its own
    # and its first-parent diff is the whole of the other branch, which would
    # flag every merge of a board branch). An "evil merge" -- a merge commit
    # hand-edited to carry board file + code -- is therefore NOT caught here.
    #
    # A board-ONLY push (pathway_forward.md) reaches this step since
    # 2026-10-01 and passes: board-only is a permitted shape. A
    # PROJECT_RULES.md-only push is still paths-ignored and starts no run --
    # correct, since a MIXED commit by definition also touches a non-ignored
    # file, so it always triggers.
    - name: Check board/code commit separation (rule 21c)
      env:
        # Interpolated into env, never into the shell body: expression
        # substitution directly inside `run:` is a script-injection surface.
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_HEAD: ${{ github.sha }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -eu
        ZERO=0000000000000000000000000000000000000000
        have() { git cat-file -e "$1^{commit}" 2>/dev/null; }
        FALLBACK=no
        case "$EVENT_NAME" in
          pull_request)
            # The PR's own commits. Both endpoints are reachable because the
            # depth-0 checkout of refs/pull/N/merge carries both parents.
            if [ -z "$PR_BASE" ] || [ -z "$PR_HEAD" ]; then
              echo "REFUSED: pull_request event carried an empty base/head sha"
              exit 1
            fi
            LO=$PR_BASE; HI=$PR_HEAD ;;
          push)
            LO=$PUSH_BEFORE; HI=$PUSH_HEAD ;;
          *)
            echo "REFUSED: event '$EVENT_NAME' has no defined range for this check"
            exit 1 ;;
        esac
        # Two push cases github.event.before cannot express. NEITHER may pass
        # silently (rule 2) -- a check that passes when it cannot determine
        # its range is not a check:
        #   (a) FIRST push of a branch -- before is 40 zeros;
        #   (b) FORCE-push -- before names a commit this clone no longer has.
        # Both fall back to a STATED range, origin/master..HEAD, which for a
        # feature branch is a SUPERSET of the push (every commit the branch
        # introduces): wrong in the safe direction, never narrower.
        if [ -z "$LO" ] || [ "$LO" = "$ZERO" ] || ! have "$LO"; then
          FALLBACK=yes
          if ! git rev-parse --verify origin/master >/dev/null 2>&1; then
            echo "REFUSED: range start '$LO' is unusable AND origin/master is"
            echo "  absent, so no range can be determined. Refusing rather"
            echo "  than checking nothing."
            exit 1
          fi
          LO=$(git rev-parse origin/master); HI=$(git rev-parse HEAD)
          echo "NOTE: github.event.before ('$PUSH_BEFORE') is unusable (first"
          echo "  push of this branch, or force-pushed away). Falling back to"
          echo "  the stated range origin/master..HEAD."
          if [ -z "$(git rev-list "$LO..$HI")" ]; then
            # HEAD is already an ancestor of origin/master. A zero-commit
            # report here would be indistinguishable from a suppressed one
            # (this is also the shape a force-push to master leaves behind),
            # so narrow to the head commit rather than report a vacuous zero.
            if ! have "$HI^"; then
              echo "REFUSED: fallback range is empty and HEAD has no parent."
              exit 1
            fi
            LO=$(git rev-parse "$HI^")
            echo "NOTE: origin/master..HEAD was EMPTY (HEAD already on"
            echo "  master). Narrowing to the head commit alone so this step"
            echo "  cannot report a vacuous zero."
          fi
        fi
        echo "check_board_separation range: $LO..$HI (event=$EVENT_NAME, fallback=$FALLBACK)"
        # --squash-check (2026-09-30, PR #69 / ff06534 incident): this repo
        # squash-merges every PR (rule 25) -- a `pull_request` range whose
        # individual commits are each clean can still union to a mixed
        # commit once merged, which the per-commit check alone cannot see.
        # `push` events are never squashed by this repo's settings, so the
        # existing per-commit check already covers them.
        if [ "$EVENT_NAME" = "pull_request" ]; then
          python3 testsys/check_board_separation.py "$LO..$HI" --squash-check
        else
          python3 testsys/check_board_separation.py "$LO..$HI"
        fi

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # All 3 shards install the SAME package set (the shard split is by
    # regression SCRIPT, not by dependency), so one cache key -- independent
    # of matrix.shard -- serves all 3 and only needs populating once per
    # workflow-file change. Keyed on this file's own hash rather than a
    # requirements.txt (there isn't one): the `pip install` lines below are
    # the only place these versions are pinned/unpinned, so a change to them
    # is exactly a change to this file.
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/test.yml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install git vim make mpich
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        sudo apt-get install python3 python3-pip
        # scipy: scripts/convertFaultGeometry's interpolation paths
        # (RegularGridInterpolator, griddata), imported lazily there but
        # exercised by the unit tier.
        # jax: the e2e sweep's python-jax column and test_backend_jax.py.
        # A missing jaxlib is a hard failure, not a fallback to numpy.
        # mpi4py: eqdyna3d.py's --mpi path, MPI4NodalQuant.py's _MPI(), and
        # testsys/perf/probe_mpi_reproducibility.py all `from mpi4py import
        # MPI` (deliberately uncaught ImportError, not a fallback) --
        # test_ci_dependencies.py scans for exactly this and needs it real,
        # not just declared.
        pip install numpy scipy netCDF4 matplotlib xarray pytest mpi4py
        pip install --upgrade numpy
        # jax LAST: it pins a numpy range, and `--upgrade numpy` above would
        # otherwise move numpy out from under it after the fact.
        pip install jax

    - name: Download eqdyna binary
      uses: actions/download-artifact@v4
      with:
        name: eqdyna-bin
        path: bin

    # actions/upload-artifact's zip round-trip does not reliably preserve the
    # executable bit on Linux -- set it explicitly rather than assume.
    - name: Restore exec bit on eqdyna binary
      run: chmod +x bin/eqdyna

    - name: Run ci_shard ${{ matrix.shard }} (unit + regression, sharded)
      env:
        # Several sharded regression scripts (test_pretag_ci_negative.py,
        # test_publish_image_fetch_depth.py, check_pretag_ci.py and others --
        # see ci_status.py) call `gh` to check CI/tag state. Without a token
        # they report UNVERIFIED rather than checking anything.
        # test_release_complete.py is NOT one of them: it is excluded from
        # this sweep entirely (testsys/regression_sweep_exclusions.py,
        # 2026-09-30) because its checks are meaningful only when auditing an
        # already-tagged release, not on every commit/PR -- see that module's
        # docstring for the incident (v5.20.2 shipped with no Docker image
        # because this job used to run it here and its GitHub-Release check
        # is not safe to treat as pass/fail this early -- no guaranteed
        # ordering against the Release object becoming queryable).
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        set -o pipefail
        python3 testsys/ci_shard.py run ${{ matrix.shard }} 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt


  # matrix.CI_CELLS in full: test.tpv8 x {fortran, python-jax},
  # at the gate term (5 s) -- the ONE e2e job CI runs (2026-09-23,
  # owner-approved test-methodology change; see the jobs: comment above).
  # This job's purpose is portability, not physics coverage: a clean
  # checkout, freshly `pip install`ed dependencies, and mpirun against the
  # RUNNER's own mpich (distinct from this dev box's Open MPI 4.1.1) for the
  # fortran cell. Uses the build job's binary via EQDYNA_E2E_BIN so it never
  # rebuilds.
  e2e-ci-smoke:
    needs: [build, detect-lane]
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.detect-lane.outputs.lane == 'full') }}
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install mpich
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        sudo apt-get install python3 python3-pip
        pip install numpy scipy netCDF4 matplotlib xarray
        pip install --upgrade numpy
        pip install jax

    - name: Download eqdyna binary
      uses: actions/download-artifact@v4
      with:
        name: eqdyna-bin
        path: bin

    - name: Restore exec bit on eqdyna binary
      run: chmod +x bin/eqdyna

    - name: Run e2e-ci (smoke - test.tpv8 x fortran/python-jax, gate term)
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        export EQDYNA_E2E_BIN=$EQDYNAROOT/bin/eqdyna
        # Pin numpy's own BLAS thread pools -- see run.py's other e2e jobs'
        # historical rationale (unpinned numpy scattered ms/step with no
        # dependence on step count).
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
        set -o pipefail
        python3 testsys/e2e/run_e2e.py --ci 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt

  # Fast lane (PR-for-everything, owner decision 2026-10-04): a PR
  # detect-lane classified `fast` (no gated path touched) skips only
  # e2e-ci-smoke (build and unit-regression run on both lanes since
  # 2026-10-07) and adds this job's content checks --
  # the four existing content guards rule 25 already names when the PR
  # touches README.md or docs/user/**, or, when it touches neither, a
  # SAFETY RE-CHECK that this PR's own diff still classifies LANE=fast (a
  # second pr-lane call against the same base/head, independent of
  # detect-lane's), so nothing gated can slip into what detect-lane called a
  # docs-only PR between that job running and this one. No victor-reyes
  # audit, no queueing behind a code PR.
  fast-lane-checks:
    needs: detect-lane
    if: github.event_name == 'pull_request' && needs.detect-lane.outputs.lane == 'fast'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run the matching fast-lane check
      env:
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -eu
        CHANGED=$(git diff --name-only "$PR_BASE...$PR_HEAD")
        COUNT=$(printf '%s\n' "$CHANGED" | grep -c . || true)
        echo "changed file(s) ($COUNT total):"
        printf '%s\n' "$CHANGED"
        if printf '%s\n' "$CHANGED" | grep -qE '^(README\.md$|docs/user/)'; then
          echo "README.md or docs/user/** touched -- running the four content guards (rule 25)"
          python3 testsys/regression/test_readme_commands.py
          python3 testsys/regression/test_user_docs_style.py
          python3 testsys/regression/test_params_reference_freshness.py
          python3 testsys/regression/test_user_docs_coverage.py
        else
          echo "no README.md/docs/user/** path touched -- re-checking this PR's own diff still classifies LANE=fast"
          OUT=$(python3 testsys/pr_policy.py pr-lane "$PR_BASE" "$PR_HEAD")
          echo "$OUT"
          printf '%s\n' "$OUT" | grep -q '^LANE=fast$' || {
            echo "FAIL: pr-lane re-check did not say LANE=fast for a PR detect-lane already called fast"
            exit 1
          }
        fi

  # Required-status unification (PR-for-everything, owner decision
  # 2026-10-04): branch protection (applied as a FOLLOW-UP, after this PR
  # merges -- see PROJECT_RULES.md rule 25) names ONE required check, this
  # job, so a required-check list does not itself have to vary by lane. It
  # reaches both lanes (`if: always()`, not the default success()-only
  # condition, so a skipped heavy job in the fast lane or a skipped
  # fast-lane-checks in the full lane does not short-circuit it away) and
  # fails unless the lane that actually ran, actually passed -- reading each
  # needed job's own `.result` explicitly rather than trusting that it ran
  # at all, so a `skipped` job can never silently count as a pass.
  merge-gate:
    needs: [detect-lane, build, unit-regression, e2e-ci-smoke, fast-lane-checks]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-22.04

    steps:
    - name: Require the lane that ran to have actually passed
      env:
        LANE: ${{ needs.detect-lane.outputs.lane }}
        BUILD_RESULT: ${{ needs.build.result }}
        UNIT_REGRESSION_RESULT: ${{ needs.unit-regression.result }}
        E2E_RESULT: ${{ needs.e2e-ci-smoke.result }}
        FAST_LANE_RESULT: ${{ needs.fast-lane-checks.result }}
      run: |
        set -eu
        echo "lane=$LANE build=$BUILD_RESULT unit-regression=$UNIT_REGRESSION_RESULT e2e-ci-smoke=$E2E_RESULT fast-lane-checks=$FAST_LANE_RESULT"
        case "$LANE" in
          full)
            if [ "$BUILD_RESULT" = "success" ] && [ "$UNIT_REGRESSION_RESULT" = "success" ] && [ "$E2E_RESULT" = "success" ]; then
              echo "PASS: full lane -- build, unit-regression and e2e-ci-smoke all succeeded"
              exit 0
            fi
            echo "FAIL: full lane requires build, unit-regression and e2e-ci-smoke to ALL succeed (skipped does not count as a pass)"
            exit 1 ;;
          fast)
            if [ "$BUILD_RESULT" = "success" ] && [ "$UNIT_REGRESSION_RESULT" = "success" ] && [ "$FAST_LANE_RESULT" = "success" ]; then
              echo "PASS: fast lane -- build, unit-regression and fast-lane-checks all succeeded"
              exit 0
            fi
            echo "FAIL: fast lane requires build, unit-regression and fast-lane-checks to ALL succeed (skipped does not count as a pass)"
            exit 1 ;;
          *)
            echo "FAIL: detect-lane did not produce a recognized lane ('$LANE')"
            exit 1 ;;
        esac

  # PR-for-everything workflow (owner decision 2026-10-04, superseding the
  # 2026-09-23 hybrid model): EVERY commit now reaches master only through a
  # merged pull request (squash-merge on GitHub), fast lane included -- this
  # job is the AUTHORITATIVE half of that enforcement -- testsys/hooks/
  # pre-push is the LOCAL half, installed the same way as testsys/hooks/
  # pre-commit (core.hooksPath). Both call testsys/pr_policy.py, so there is
  # ONE copy of the decision logic; this job runs it in `ci-check` mode,
  # which can call GitHub's commits-pulls API (the local hook cannot, and
  # does not need to -- see that module's own docstring for why). Under the
  # new model ci-check requires PR evidence for every non-empty commit, not
  # only one touching a gated path -- a push whose own content is entirely
  # fast-lane (docs/board/evidence) must STILL have arrived via a merged,
  # auto-squashed PR, and this job checks that exactly the same way it
  # checks a full-lane push.
  #
  # RUNS ONLY on a push that lands directly on refs/heads/master -- not on
  # pull_request (a PR's own commits are reviewed and gated when the MERGE
  # itself lands as a push to master, not before that), and not on a push to
  # any other branch. `needs: []` (no dependency on the build job): this
  # check reads only git history plus the commits-pulls API and must be able
  # to fail fast without waiting on a full compile.
  #
  # test_ci_pr_policy_step.py (testsys/regression/) is the guard that this
  # job cannot be silently deleted, disarmed with an `if:`, or downgraded to
  # a shallow checkout without a regression tier failure.
  pr-policy-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    # Explicit, so the commits-pulls API call never depends on the repo's
    # default token setting (audit H3, 2026-09-23).
    permissions:
      contents: read
      pull-requests: read

    steps:
    # fetch-depth: 0 -- testsys/pr_policy.py resolves a COMMIT RANGE
    # (github.event.before..github.sha) and inspects each commit's changed
    # paths; the action's default depth of 1 would leave github.event.before
    # unreachable, which the module treats as a HARD failure (there is no
    # safe superset fallback for a push-to-master range -- see
    # resolve_push_range's own docstring), never a silent pass.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Enforce src/ and testsys/ reach master only via a merged PR
      env:
        # GITHUB_REPOSITORY is one of Actions' default env vars (always
        # set); GITHUB_TOKEN is NOT auto-exported to steps and must be
        # passed explicitly. Interpolated into env, never into the shell
        # body, matching the board-separation step's own rationale
        # (expression substitution directly inside `run:` is a
        # script-injection surface).
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_HEAD: ${{ github.sha }}
      run: |
        python3 testsys/pr_policy.py ci-check "$PUSH_BEFORE" "$PUSH_HEAD"
