name: Automatic Testing of EQdyna

# paths-ignore is deliberately NARROW, not a blanket '**.md': README.md is
# read by test_readme_commands.py and test_release_complete.py, so it stays
# in the trigger set unconditionally. pathway_forward.md and
# PROJECT_RULES.md are excluded -- a release commit always also touches
# non-md files (e.g. VERSION), so it still triggers CI regardless.
on:
  push:
    paths-ignore:
      - 'pathway_forward.md'
      - 'PROJECT_RULES.md'
      - 'pastReleaseNotes.md'
      - 'Docker.guide.md'
      - 'docs/**'
  pull_request:

# A push to a branch with an open PR fires BOTH `push` and `pull_request`
# for the identical commit. Grouping by the ACTUAL head commit (not by ref,
# which differs between the two events) puts both runs in the same
# concurrency group, so the second one cancels the first instead of both
# running to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Build runs once in its own job; unit/regression and each e2e-ci slice run
# in parallel jobs downstream, each with its own runner memory budget (see
# testsys/matrix.py's CI_CELLS comment).
#
# test_ci_workflow_coverage.py proves the union of every `run_e2e.py --ci`
# invocation in this file is exactly matrix.CI_CELLS by parsing this file and
# the table directly, so a future edit that silently drops or double-runs a
# cell fails the regression tier regardless of how many jobs or invocations
# this grows to.
#
# The fortran slice is split into two jobs (group A/B) and the python slice
# into five, balanced by measured per-cell cost. test.tpv29 x python-numpy is
# isolated in its own job because it is an order of magnitude more expensive
# than any other python cell; test.tpv36 x python-numpy and test.tpv37 x
# python-numpy are EACH isolated in their own job (2026-09-23) for the same
# reason -- measured 1256.7 s and 1269.7 s respectively, together 42 of the
# old combined job's 59 min because run_e2e.py's default core budget on a
# standard GitHub runner (os.cpu_count()-4, floored at 1) is 1, i.e. cells in
# one invocation run strictly SERIALLY, not concurrently -- so co-locating
# two ~21-minute cells in one job serialises their cost instead of hiding it.
# The remaining python-jax cells (plus test.tpv8 x python-numpy, cheap enough
# to keep alongside its own jax column) stay together in one job since their
# serial sum is ~16 min, comfortably under the ~21-22 min the two isolated
# numpy jobs now cost on their own.
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install build dependencies
      run: |
        sudo apt-get install git vim make mpich
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        sudo apt-get install python3 python3-pip

    # Exec bits are tracked in git (PROJECT_RULES.md rule 13) and guarded by
    # testsys/regression/test_create_newcase.py.
    - name: Build eqdyna
      run: ./install-eqdyna.sh -m ubuntu

    # Every other job downloads THIS binary rather than rebuilding, so a
    # build failure is unambiguous (only the build job goes red).
    - name: Upload eqdyna binary
      uses: actions/upload-artifact@v4
      with:
        name: eqdyna-bin
        path: bin/eqdyna
        if-no-files-found: error
        retention-days: 1

  # unit + regression in one job, matching testsys/run.py's own
  # 'unit regression' grouping. Needs the FULL build toolchain, not just the
  # artifact: several regression guards do their OWN independent compiles
  # (test_make_default_goal.py, test_fault_geometry_guard.py,
  # test_drucker_prager_kernel.py), and test_stop_exit_status.py's
  # real-binary probe needs bin/eqdyna present or it SKIPS.
  unit-regression:
    needs: build
    runs-on: ubuntu-22.04

    steps:
    # fetch-depth: 0 -- this job, alone among the seven, needs real git
    # HISTORY, not just the tree. test_pretag_ci_negative.py drives the
    # pre-tag guard against named past commits (their parents, their
    # changed-path sets), test_history_table.py re-parses the eight legacy
    # commit messages, and the board-separation step below resolves a COMMIT
    # RANGE; checkout@v4's default depth of 1 would leave those commits
    # unreachable, turning all three into vacuous passes -- that shallow-clone
    # failure is not hypothetical, it took publish.yml red on 2026-09-23
    # (fixed in a99902f). fetch-depth: 0 also fetches
    # +refs/heads/*:refs/remotes/origin/*, which is what makes `origin/master`
    # resolvable for that step's fallback range.
    # The repo is 723 commits; the full fetch costs seconds.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Rule 21c / pathway item 80: the MERGE-BOUNDARY half of board/code
    # separation. testsys/hooks/pre-commit refuses a commit whose STAGED set
    # mixes PROJECT_RULES.md/pathway_forward.md with anything else, but it
    # cannot see a `git commit --amend` -- `git diff --cached` compares the
    # index against the commit being REPLACED, so amending code into an
    # existing board-only commit shows the hook a clean set and lands mixed
    # anyway. This step closes that over finished history, on the way in.
    #
    # It sits FIRST in this job, ahead of apt/pip, because it needs nothing
    # but git and the runner's system python3 (the checker is stdlib-only)
    # and a violation should cost seconds, not the whole install.
    #
    # LIMIT, stated so nobody reads this gate as total: the checker skips
    # MERGE commits by design (an automatic merge adds no content of its own
    # and its first-parent diff is the whole of the other branch, which would
    # flag every merge of a board branch). An "evil merge" -- a merge commit
    # hand-edited to carry board file + code -- is therefore NOT caught here.
    #
    # Nor does a board-ONLY push reach this step: the workflow's own
    # paths-ignore (top of file) starts no run for one. That is correct and
    # costs nothing -- a MIXED commit by definition also touches a non-board
    # file, so it always triggers.
    - name: Check board/code commit separation (rule 21c)
      env:
        # Interpolated into env, never into the shell body: expression
        # substitution directly inside `run:` is a script-injection surface.
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_HEAD: ${{ github.sha }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -eu
        ZERO=0000000000000000000000000000000000000000
        have() { git cat-file -e "$1^{commit}" 2>/dev/null; }
        FALLBACK=no
        case "$EVENT_NAME" in
          pull_request)
            # The PR's own commits. Both endpoints are reachable because the
            # depth-0 checkout of refs/pull/N/merge carries both parents.
            if [ -z "$PR_BASE" ] || [ -z "$PR_HEAD" ]; then
              echo "REFUSED: pull_request event carried an empty base/head sha"
              exit 1
            fi
            LO=$PR_BASE; HI=$PR_HEAD ;;
          push)
            LO=$PUSH_BEFORE; HI=$PUSH_HEAD ;;
          *)
            echo "REFUSED: event '$EVENT_NAME' has no defined range for this check"
            exit 1 ;;
        esac
        # Two push cases github.event.before cannot express. NEITHER may pass
        # silently (rule 2) -- a check that passes when it cannot determine
        # its range is not a check:
        #   (a) FIRST push of a branch -- before is 40 zeros;
        #   (b) FORCE-push -- before names a commit this clone no longer has.
        # Both fall back to a STATED range, origin/master..HEAD, which for a
        # feature branch is a SUPERSET of the push (every commit the branch
        # introduces): wrong in the safe direction, never narrower.
        if [ -z "$LO" ] || [ "$LO" = "$ZERO" ] || ! have "$LO"; then
          FALLBACK=yes
          if ! git rev-parse --verify origin/master >/dev/null 2>&1; then
            echo "REFUSED: range start '$LO' is unusable AND origin/master is"
            echo "  absent, so no range can be determined. Refusing rather"
            echo "  than checking nothing."
            exit 1
          fi
          LO=$(git rev-parse origin/master); HI=$(git rev-parse HEAD)
          echo "NOTE: github.event.before ('$PUSH_BEFORE') is unusable (first"
          echo "  push of this branch, or force-pushed away). Falling back to"
          echo "  the stated range origin/master..HEAD."
          if [ -z "$(git rev-list "$LO..$HI")" ]; then
            # HEAD is already an ancestor of origin/master. A zero-commit
            # report here would be indistinguishable from a suppressed one
            # (this is also the shape a force-push to master leaves behind),
            # so narrow to the head commit rather than report a vacuous zero.
            if ! have "$HI^"; then
              echo "REFUSED: fallback range is empty and HEAD has no parent."
              exit 1
            fi
            LO=$(git rev-parse "$HI^")
            echo "NOTE: origin/master..HEAD was EMPTY (HEAD already on"
            echo "  master). Narrowing to the head commit alone so this step"
            echo "  cannot report a vacuous zero."
          fi
        fi
        echo "check_board_separation range: $LO..$HI (event=$EVENT_NAME, fallback=$FALLBACK)"
        python3 testsys/check_board_separation.py "$LO..$HI"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install git vim make mpich
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        sudo apt-get install python3 python3-pip
        # scipy: scripts/convertFaultGeometry's interpolation paths
        # (RegularGridInterpolator, griddata), imported lazily there but
        # exercised by the unit tier.
        # jax: the e2e sweep's python-jax column and test_backend_jax.py.
        # A missing jaxlib is a hard failure, not a fallback to numpy.
        # mpi4py: eqdyna3d.py's --mpi path, MPI4NodalQuant.py's _MPI(), and
        # testsys/perf/probe_mpi_reproducibility.py all `from mpi4py import
        # MPI` (deliberately uncaught ImportError, not a fallback) --
        # test_ci_dependencies.py scans for exactly this and needs it real,
        # not just declared.
        pip install numpy scipy netCDF4 matplotlib xarray pytest mpi4py
        pip install --upgrade numpy
        # jax LAST: it pins a numpy range, and `--upgrade numpy` above would
        # otherwise move numpy out from under it after the fact.
        pip install jax

    - name: Download eqdyna binary
      uses: actions/download-artifact@v4
      with:
        name: eqdyna-bin
        path: bin

    # actions/upload-artifact's zip round-trip does not reliably preserve the
    # executable bit on Linux -- set it explicitly rather than assume.
    - name: Restore exec bit on eqdyna binary
      run: chmod +x bin/eqdyna

    - name: Run unit + regression tests
      env:
        # test_release_complete.py's check_network_side calls `gh release
        # view` to confirm rule 15 step 9 (gh release create) actually ran.
        # Without a token it reports UNVERIFIED rather than checking anything.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        set -o pipefail
        python3 testsys/run.py unit regression 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt

  # The fortran slice of matrix.CI_CELLS, all 8 cases on the fortran/MPI
  # backend, split across two jobs (balanced by measured per-cell seconds on
  # this CI runner, not the README's 64-core-box numbers -- rule 6) so they
  # run as two parallel SERIAL-4 groups instead of one SERIAL-8 group.
  # Both use the build job's binary via EQDYNA_E2E_BIN so neither rebuilds.
  e2e-ci-fortran-a:
    needs: build
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install mpich
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        sudo apt-get install python3 python3-pip
        pip install numpy netCDF4 matplotlib xarray
        pip install --upgrade numpy

    - name: Download eqdyna binary
      uses: actions/download-artifact@v4
      with:
        name: eqdyna-bin
        path: bin

    - name: Restore exec bit on eqdyna binary
      run: chmod +x bin/eqdyna

    - name: Run e2e-ci (fortran cells, group A)
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        export EQDYNA_E2E_BIN=$EQDYNAROOT/bin/eqdyna
        set -o pipefail
        python3 testsys/e2e/run_e2e.py --ci --backends fortran --cases test.tpv29,test.tpv1053d,test.tpv104,test.tpv8,test.tpv37 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt

  e2e-ci-fortran-b:
    needs: build
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install mpich
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        sudo apt-get install python3 python3-pip
        pip install numpy netCDF4 matplotlib xarray
        pip install --upgrade numpy

    - name: Download eqdyna binary
      uses: actions/download-artifact@v4
      with:
        name: eqdyna-bin
        path: bin

    - name: Restore exec bit on eqdyna binary
      run: chmod +x bin/eqdyna

    - name: Run e2e-ci (fortran cells, group B)
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        export EQDYNA_E2E_BIN=$EQDYNAROOT/bin/eqdyna
        set -o pipefail
        python3 testsys/e2e/run_e2e.py --ci --backends fortran --cases test.drv.a6,test.meng2023a,test.meng2023cb,test.tpv10,test.tpv36 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt

  # The python slice of matrix.CI_CELLS, split across five jobs by measured
  # cost (see matrix.MEASURED_PEAK_RSS_GB). No fortran cell is selected in
  # any of the five, so none needs `needs: build`, mpich, or netCDF dev
  # headers. test.tpv29 x python-numpy alone dwarfs every other python cell
  # and is isolated in its own job (e2e-ci-python-tpv29) below; test.tpv36 x
  # python-numpy and test.tpv37 x python-numpy are EACH isolated in their own
  # job for the same reason (e2e-ci-python-tpv36-numpy /
  # e2e-ci-python-tpv37-numpy, below) -- see the top-of-file comment.
  #
  # Renamed from e2e-ci-python-cheap (2026-09-23): with the two ~21-minute
  # numpy cells moved out, this job now runs test.tpv8 on both backends plus
  # every remaining python-jax-only cell (tpv10/tpv104/tpv1053d, and the
  # jax columns of tpv36/tpv37) -- "cheap" no longer named a specific enough
  # set once tpv36/tpv37 split. Grep the OLD name (e2e-ci-python-cheap)
  # before assuming any doc or test still means this job.
  e2e-ci-python-jax-tpv8:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install python3 python3-pip
        pip install numpy scipy netCDF4 matplotlib xarray
        pip install --upgrade numpy
        pip install jax

    # tpv8 (both backends) + tpv10/tpv104/tpv1053d jax-only (numpy columns
    # never measured, so excluded per matrix.py's "no cell without a
    # measured RSS" rule) + tpv36/tpv37 jax-only (their numpy columns now run
    # in their own isolated jobs, below -- see the top-of-file comment).
    - name: Run e2e-ci (python cells, jax + tpv8 group)
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        # Pin numpy's own BLAS thread pools: unpinned numpy scattered
        # 2072-3747 ms/step with NO dependence on step count, while pinned
        # is linear to 0.2%. This buys determinism, not speed.
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
        set -o pipefail
        python3 testsys/e2e/run_e2e.py --ci --cases test.tpv8 --backends python-numpy,python-jax 2>&1 | tee -a testRunLog.txt
        python3 testsys/e2e/run_e2e.py --ci --cases test.tpv10,test.tpv104,test.tpv1053d --backends python-jax 2>&1 | tee -a testRunLog.txt
        python3 testsys/e2e/run_e2e.py --ci --cases test.tpv36,test.tpv37 --backends python-jax 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt

  # test.tpv36 x python-numpy ALONE: measured 1256.7 s (2026-09-23), the
  # second most expensive python cell in the table after tpv29 x python-numpy
  # and formerly co-located with tpv37's numpy cell in the same job, where
  # run_e2e.py's default serial core budget summed the two to 42 of the old
  # job's 59 minutes. This job's own wall clock is now its critical path --
  # nothing left to parallelize inside one sequential simulation.
  e2e-ci-python-tpv36-numpy:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install python3 python3-pip
        pip install numpy scipy netCDF4 matplotlib xarray
        pip install --upgrade numpy
        pip install jax

    - name: Run e2e-ci (python cells, tpv36-numpy)
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        # Pin numpy's own BLAS thread pools -- see the jax-tpv8 group job above.
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
        set -o pipefail
        python3 testsys/e2e/run_e2e.py --ci --cases test.tpv36 --backends python-numpy 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt

  # test.tpv37 x python-numpy ALONE: measured 1269.7 s (2026-09-23) -- see
  # the tpv36-numpy job's comment above for why this is isolated the same way.
  e2e-ci-python-tpv37-numpy:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install python3 python3-pip
        pip install numpy scipy netCDF4 matplotlib xarray
        pip install --upgrade numpy
        pip install jax

    - name: Run e2e-ci (python cells, tpv37-numpy)
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        # Pin numpy's own BLAS thread pools -- see the jax-tpv8 group job above.
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
        set -o pipefail
        python3 testsys/e2e/run_e2e.py --ci --cases test.tpv37 --backends python-numpy 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt

  e2e-ci-python-meng:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install python3 python3-pip
        pip install numpy scipy netCDF4 matplotlib xarray
        pip install --upgrade numpy
        pip install jax

    # meng2023a + meng2023cb, both backends -- plus test.tpv29 x python-jax,
    # deliberately NOT test.tpv29 x python-numpy, which is isolated in its
    # own job below because it is an order of magnitude more expensive than
    # everything else in this group combined.
    - name: Run e2e-ci (python cells, meng2023a/cb + tpv29-jax)
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        # Pin numpy's own BLAS thread pools -- see the cheap-group job above.
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
        set -o pipefail
        python3 testsys/e2e/run_e2e.py --ci --cases test.meng2023a,test.meng2023cb --backends python-numpy,python-jax 2>&1 | tee -a testRunLog.txt
        python3 testsys/e2e/run_e2e.py --ci --cases test.tpv29 --backends python-jax 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt

  e2e-ci-python-tpv29:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install python3 python3-pip
        pip install numpy scipy netCDF4 matplotlib xarray
        pip install --upgrade numpy
        pip install jax

    # test.tpv29 x python-numpy ALONE: by far the single most expensive cell
    # in the table (matrix.MEASURED_PEAK_RSS_GB). This job's own wall clock
    # is the new CI critical path -- there is nothing left to parallelize
    # inside one sequential simulation.
    - name: Run e2e-ci (python cells, tpv29-numpy)
      run: |
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        # Pin numpy's own BLAS thread pools: unpinned 2072-3747 ms/step
        # scattered with no dependence on step count; pinned 2072 ms/step,
        # linear to 0.2%.
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
        set -o pipefail
        python3 testsys/e2e/run_e2e.py --ci --cases test.tpv29 --backends python-numpy 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt
