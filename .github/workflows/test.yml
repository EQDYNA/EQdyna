name: Automatic Testing of EQdyna

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install git vim make mpich
        sudo apt-get install libnetcdf-dev libnetcdff-dev
        sudo apt-get install python3 python3-pip
        # scipy: scripts/convertFaultGeometry's interpolation paths
        # (RegularGridInterpolator, griddata). Imported lazily there, so the
        # exact-decimation path works without it -- but the unit tier exercises
        # interpolation, and its absence is what turned v5.6.1's CI red.
        #
        # jax: the e2e sweep's python-jax column. Since the no-fallback change
        # (v5.6.2) a missing jaxlib is a hard failure rather than a quiet
        # demotion to numpy -- which is the point: CI must not report "jax
        # passed" while having run numpy. CPU wheel only; the runner has no
        # GPU, so this exercises the XLA CPU path.
        pip install numpy scipy netCDF4 matplotlib xarray pytest
        pip install --upgrade numpy
        # jax LAST: it pins a numpy range, and `--upgrade numpy` above would
        # otherwise move numpy out from under it after the fact.
        pip install jax

    # Exec bits are tracked in git (PROJECT_RULES.md rule 13) and guarded by
    # testsys/regression/test_create_newcase.py — no chmod here. Exit codes
    # gate directly: testsys/run.py and testAll.py exit non-zero on failure.
    - name: Run tests
      run: |
        ./install-eqdyna.sh -m ubuntu 2>&1 | tee -a testRunLog.txt
        export EQDYNAROOT=$(pwd)
        export PATH=$EQDYNAROOT/bin:$EQDYNAROOT/scripts:$PATH
        set -o pipefail
        # e2e-ci runs testsys/matrix.py's CI_CELLS: every case on the fortran
        # backend, plus test.tpv8 on BOTH python backends. Which cells, and
        # why, is declared in that table with the measured peak RSS next to
        # each one -- not in an env var here. A GitHub ubuntu-22.04 runner has
        # 7 GB and is already holding the Fortran build; the python/jax column
        # peaks at 3.2-7.4 GB for the other cases, and running them all once
        # got the job SIGTERM'd with no output (exit 143), which is a resource
        # kill, not a test result.
        #
        # The sweep prints the cells it ran and the cells it did not, so a
        # green CI run states its own coverage instead of implying the full
        # 24-cell table. The full sweep is `python3 testsys/run.py all`, run
        # locally or on a bigger runner. Widening CI_CELLS needs a memory
        # measurement first, not a guess.
        python3 testsys/run.py unit regression e2e-ci 2>&1 | tee -a testRunLog.txt

    - name: Print testRunLog.txt
      if: always()
      run: cat testRunLog.txt
