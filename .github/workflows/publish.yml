name: Publish EQdyna Docker image

# Builds and publishes the image described by the root Dockerfile to GHCR.
# Push to the REGISTRY is gated on a tag push only (see Docker.guide.md);
# workflow_dispatch runs build+gate without publishing (push and `:latest`
# below are both gated on `github.event_name == 'push'`).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write   # GITHUB_TOKEN needs this to push to ghcr.io

    steps:
    # fetch-depth 0, NOT the default 1: `COPY . /opt/eqdyna` below puts THIS
    # checkout's .git inside the image, and two regression guards read real
    # history from it -- test_history_table.py (the 8 bulk-imported commits of
    # 2018-11-26) and test_pretag_ci_negative.py (5 referenced SHAs). On a
    # shallow clone both FAIL, which is the guards working: they refuse to
    # pass on history they cannot see. That is what took this workflow red on
    # 894cdc1 (v5.16.0), so that tag's image was never pushed -- the gate runs
    # before the push step. Fixed here rather than by teaching the guards to
    # skip: a guard that skips when its evidence is missing is not a gate.
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Log in to ghcr.io
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    # On a tag push, GITHUB_REF_NAME IS the version (e.g. v5.8.6). On a
    # workflow_dispatch it is a branch name, not a version -- used only as a
    # local, never-pushed build tag.
    - name: Compute image tag
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        else
          echo "TAG=dispatch-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
        fi

    - name: Build image
      run: |
        docker build -t ghcr.io/eqdyna/eqdyna:"${TAG}" .
        if [ "${{ github.event_name }}" = "push" ]; then
          docker tag ghcr.io/eqdyna/eqdyna:"${TAG}" ghcr.io/eqdyna/eqdyna:latest
        fi

    # Gate BEFORE push: run the repo's own unit+regression tiers and one
    # real e2e case (fortran backend; image excludes jax, see Dockerfile)
    # INSIDE the just-built image. pytest/scipy/jax are CI-only, not shipped
    # in the image itself -- jax added here because the item-41
    # regression guard (test_stress_i0_carry_aliasing.py) exercises BOTH
    # backends, including jax, even though the e2e case below stays
    # fortran-only; a missing jax must FAIL that guard, never skip it (rule
    # 2 -- test_stop_exit_status.py already burned this project once on a
    # guard that skipped instead of failing). A failing gate stops the job;
    # push never runs.
    - name: Gate the image on the repo's own test tiers (not a --version smoke test)
      run: |
        docker run --rm ghcr.io/eqdyna/eqdyna:"${TAG}" bash -lc '
          set -e
          pip3 install pytest scipy
          pip3 install jax
          cd /opt/eqdyna
          python3 testsys/run.py unit regression
          python3 testsys/e2e/run_e2e.py --cases test.tpv8 --backends fortran
        '

    # Dispatch runs stop here: build + gate, nothing pushed.
    - name: Push image
      if: github.event_name == 'push'
      run: |
        docker push ghcr.io/eqdyna/eqdyna:"${TAG}"
        docker push ghcr.io/eqdyna/eqdyna:latest

  # Separate job -> a FRESH runner. Pulls the image just pushed and re-runs
  # the same gate, catching a registry-roundtrip-only failure (manifest,
  # layer squashing, auth). Skipped on a dispatch run: nothing was pushed.
  verify-published-image:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
    - name: Log in to ghcr.io
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Pull the just-published image fresh
      run: docker pull ghcr.io/eqdyna/eqdyna:"${GITHUB_REF_NAME}"

    - name: Re-run the gate against the pulled image
      run: |
        TAG="${GITHUB_REF_NAME}"
        docker run --rm ghcr.io/eqdyna/eqdyna:"${TAG}" bash -lc '
          set -e
          pip3 install pytest scipy
          pip3 install jax
          cd /opt/eqdyna
          python3 testsys/run.py unit regression
          python3 testsys/e2e/run_e2e.py --cases test.tpv8 --backends fortran
        '
